server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx rejects uploads above 1 MB by default. Allow avatar-sized images.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API requests go to the backend container (reachable only inside Docker)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Uploaded files (avatars) are served by the backend
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }

    # Built files have hashed names, so browsers can keep them for a year
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # index.html must always be fresh so visitors get new versions
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vue Router: any other address returns the app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
