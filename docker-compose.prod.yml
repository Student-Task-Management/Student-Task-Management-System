services:
  frontend:
    ports: !reset []
  backend:
    environment:
      CLIENT_URL: https://${DOMAIN}
      TRUST_PROXY_HOPS: 2
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  caddy-data:
  caddy-config: